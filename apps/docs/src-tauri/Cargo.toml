[package]
name = "quire"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Quire: a word processor that keeps Word files intact"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
serde_json = "1"
docs-core = { path = "../../../crates/docs-core" }
