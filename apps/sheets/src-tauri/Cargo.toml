[package]
name = "sheaf"
version = "0.1.0"
edition = "2021"
description = "Sheaf: a spreadsheet editor that keeps Excel files intact"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
serde_json = "1"
sheets-core = { path = "../../../crates/sheets-core" }
