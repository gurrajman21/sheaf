[package]
name = "docs-core"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Backend of the word processor: document session, editing commands, layout, patch-in-place save"

[dependencies]
ooxml = { path = "../ooxml" }
# Oxi (MPL-2.0) lays out pages; pinned to the commit Phase D0 measured.
oxidocs-core = { git = "https://gitlab.com/Ryujiyasu/oxi.git", rev = "e6da60f7f5fc021bcab7468ea15a445526fdee06" }
serde_json = "1"
tiny_http = "0.12"
base64 = "0.22"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
libc = "0.2"
spellbook = "0.4.2"
